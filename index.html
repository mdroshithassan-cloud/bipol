<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Earn Cash</title>

<script
  src="//libtl.com/sdk.js"
  data-zone="11758669"
  data-sdk="show_11758669">
</script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#0f172a;
  color:#fff;
  padding-bottom:85px;
}

.header{
  padding:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.profile{
  display:flex;
  align-items:center;
  gap:10px;
}

.avatar{
  width:45px;
  height:45px;
  border-radius:50%;
  background:#22c55e;
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:bold;
}

.balance-card{
  margin:15px;
  padding:25px;
  border-radius:25px;
  background:linear-gradient(135deg,#22c55e,#16a34a);
  box-shadow:0 8px 25px rgba(0,0,0,.2);
}

.balance{
  font-size:40px;
  font-weight:bold;
  margin-top:10px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  padding:15px;
}

.box{
  background:#1e293b;
  padding:20px;
  border-radius:18px;
  text-align:center;
}

.box h3{
  font-size:15px;
  color:#cbd5e1;
}

.box h2{
  margin-top:8px;
}

.watch-area{
  padding:15px;
}

.watch-btn{
  width:100%;
  padding:16px;
  border:none;
  border-radius:15px;
  background:#22c55e;
  color:#fff;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
  transition:.2s;
}

.watch-btn:active{
  transform:scale(.97);
}

.watch-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.message{
  text-align:center;
  margin-top:12px;
  color:#94a3b8;
  font-size:14px;
  min-height:20px;
}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:70px;
  background:#111827;
  display:flex;
  justify-content:space-around;
  align-items:center;
  border-top:1px solid #334155;
  z-index:100;
}

.nav-btn{
  background:none;
  border:none;
  color:#94a3b8;
  display:flex;
  flex-direction:column;
  align-items:center;
  font-size:12px;
  cursor:pointer;
}

.nav-btn i{
  font-size:22px;
  margin-bottom:4px;
}

.nav-btn.active{
  color:#22c55e;
}

.page{
  display:none;
}

.page.active-page{
  display:block;
}

.copy-btn{
  margin-top:15px;
  padding:10px 18px;
  border:0;
  border-radius:10px;
  background:#22c55e;
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="page active-page">

  <div class="header">
    <div class="profile">
      <div class="avatar">E</div>
      <div>
        <b>Rakib</b><br>
        <small>Premium User</small>
      </div>
    </div>

    <i class="fa-solid fa-bell"></i>
  </div>

  <div class="balance-card">
    <p>Total Balance</p>
    <div class="balance">
      ৳<span id="balance">0</span>
    </div>
  </div>

  <div class="grid">

    <div class="box">
      <h3>Ads Watched</h3>
      <h2 id="ads">0</h2>
    </div>

    <div class="box">
      <h3>Referral</h3>
      <h2 id="referral">0</h2>
    </div>

  </div>

  <div class="watch-area">
    <button
      id="watchButton"
      class="watch-btn"
      onclick="watchAd()">
      <i class="fa-solid fa-play"></i>
      Watch Rewarded Ad
    </button>

    <div id="message" class="message"></div>
  </div>

</div>


<!-- WALLET -->
<div id="wallet" class="page">

  <div class="header">
    <h2>Wallet</h2>
  </div>

  <div class="balance-card">
    <h3>Current Balance</h3>

    <div class="balance">
      ৳<span id="walletBalance">0</span>
    </div>
  </div>

</div>


<!-- REFER -->
<div id="refer" class="page">

  <div class="header">
    <h2>Refer & Earn</h2>
  </div>

  <div class="box" style="margin:15px;">

    <h3>Your Referral Code</h3>

    <br>

    <h2 id="refCode">EMRAN123</h2>

    <button class="copy-btn" onclick="copyReferral()">
      Copy Code
    </button>

  </div>

</div>


<!-- PROFILE -->
<div id="profile" class="page">

  <div class="header">
    <h2>Profile</h2>
  </div>

  <div class="box" style="margin:15px;">

    <p>Name: Rakib</p>

    <br>

    <p>Status: Active</p>

  </div>

</div>


<!-- BOTTOM NAV -->
<div class="bottom-nav">

  <button
    class="nav-btn active"
    onclick="showPage('home',this)">

    <i class="fa-solid fa-house"></i>
    <span>Home</span>

  </button>


  <button
    class="nav-btn"
    onclick="showPage('wallet',this)">

    <i class="fa-solid fa-wallet"></i>
    <span>Wallet</span>

  </button>


  <button
    class="nav-btn"
    onclick="showPage('refer',this)">

    <i class="fa-solid fa-user-group"></i>
    <span>Refer</span>

  </button>


  <button
    class="nav-btn"
    onclick="showPage('profile',this)">

    <i class="fa-solid fa-user"></i>
    <span>Profile</span>

  </button>

</div>


<script>

let balance = Number(localStorage.getItem("balance")) || 0;
let ads = Number(localStorage.getItem("ads")) || 0;
let referral = Number(localStorage.getItem("referral")) || 0;

updateUI();


function updateUI(){

  document.getElementById("balance").innerText =
    balance.toFixed(2);

  document.getElementById("walletBalance").innerText =
    balance.toFixed(2);

  document.getElementById("ads").innerText =
    ads;

  document.getElementById("referral").innerText =
    referral;

}


async function watchAd(){

  const button =
    document.getElementById("watchButton");

  const message =
    document.getElementById("message");

  button.disabled = true;

  button.innerHTML =
    '<i class="fa-solid fa-spinner fa-spin"></i> Loading Ad...';

  message.innerText = "";


  try{

    if(typeof show_11758669 !== "function"){
      throw new Error("Ad SDK is not loaded");
    }

    await show_11758669();


    // Reward
    balance += 10;
    ads += 1;


    // Save data
    localStorage.setItem(
      "balance",
      balance
    );

    localStorage.setItem(
      "ads",
      ads
    );


    updateUI();

    message.innerText =
      "Ad completed! You earned ৳10.";

  }catch(error){

    console.error(error);

    message.innerText =
      "Ad could not be completed. Please try again.";

  }


  button.disabled = false;

  button.innerHTML =
    '<i class="fa-solid fa-play"></i> Watch Rewarded Ad';

}


function showPage(id,btn){

  document
    .querySelectorAll(".page")
    .forEach(page =>
      page.classList.remove("active-page")
    );


  const selectedPage =
    document.getElementById(id);

  if(selectedPage){
    selectedPage.classList.add("active-page");
  }


  document
    .querySelectorAll(".nav-btn")
    .forEach(button =>
      button.classList.remove("active")
    );


  btn.classList.add("active");

}


function copyReferral(){

  const code =
    document.getElementById("refCode").innerText;

  navigator.clipboard
    .writeText(code)
    .then(() => {

      document.getElementById("message").innerText =
        "Referral code copied!";

    })
    .catch(() => {

      alert("Copy failed");

    });

}

</script>

</body>
</html>
